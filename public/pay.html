<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1115" />
  <title>Pay securely</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%2318c07a'/></svg>" />
</head>
<body>
  <div class="app" id="app"><div class="empty">Loading…</div></div>
  <div id="toast"></div>
  <script>
  (function () {
    const app = document.getElementById('app');
    const token = location.pathname.split('/').pop();
    const params = new URLSearchParams(location.search);
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    async function api(method, path, body) {
      const res = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'request failed');
      return data;
    }

    function paidScreen(name) {
      app.innerHTML = `
        <div class="brand"><span class="dot"></span> Payment complete</div>
        <div class="card center">
          <div style="font-size:54px">✅</div>
          <h1>Payment successful</h1>
          <p class="muted">Thank you${name ? ', ' + esc(name) : ''}! A confirmation has been sent to the seller and they will send your item shortly.</p>
        </div>`;
    }

    async function load() {
      let info;
      try {
        info = await api('GET', '/api/pay/' + encodeURIComponent(token) + '/info');
      } catch (e) {
        app.innerHTML = `<div class="card center"><h1>Link not found</h1><p class="muted">${esc(e.message)}</p></div>`;
        return;
      }

      // Returning from a real Paystack checkout (callback carries ?ref=).
      if (params.get('ref')) {
        app.innerHTML = '<div class="empty">Confirming your payment…</div>';
      }

      const p = info.product;
      app.innerHTML = `
        <div class="brand"><span class="dot"></span> ${esc(info.business.name)}</div>
        <div class="card">
          <div class="product">
            <div class="thumb">${p.photo_url ? `<img src="${esc(p.photo_url)}" class="thumb" style="margin:0"/>` : '🛍️'}</div>
            <div class="info"><div class="name">${esc(p.name)}</div><div class="meta">Pay securely</div></div>
            <div class="amount">${esc(p.price_text)}</div>
          </div>
        </div>
        ${!p.in_stock ? '<div class="card center"><strong style="color:var(--danger)">Out of stock</strong><p class="muted">Please check back with the seller.</p></div>' : `
        <div class="card">
          <div class="field"><label>Your name</label><input id="b_name" placeholder="Full name" /></div>
          <div class="field"><label>WhatsApp number</label><input id="b_phone" inputmode="tel" placeholder="0803…" /></div>
          <div class="field"><label>Email (optional)</label><input id="b_email" inputmode="email" placeholder="you@email.com" /></div>
          <button class="btn" id="payBtn">Pay ${esc(p.price_text)}</button>
          <p class="center muted" style="font-size:12px;margin-top:12px">🔒 Secured by Paystack${info.demo_mode ? ' · DEMO mode (no real charge)' : ''}</p>
        </div>`}`;

      if (!p.in_stock) return;

      document.getElementById('payBtn').onclick = async () => {
        const btn = document.getElementById('payBtn');
        btn.disabled = true;
        btn.textContent = 'Starting payment…';
        const payload = {
          buyer_name: document.getElementById('b_name').value.trim(),
          buyer_phone: document.getElementById('b_phone').value.trim(),
          email: document.getElementById('b_email').value.trim(),
          channel: params.get('c') || 'link',
        };
        try {
          const init = await api('POST', '/api/pay/' + encodeURIComponent(token) + '/init', payload);
          if (init.mode === 'live') {
            window.location = init.authorization_url;
            return;
          }
          // Demo mode: simulate the payment clearing.
          btn.textContent = 'Confirming payment…';
          await api('POST', '/api/pay/' + encodeURIComponent(token) + '/simulate', { reference: init.reference });
          paidScreen(payload.buyer_name);
        } catch (e) {
          btn.disabled = false;
          btn.textContent = 'Pay ' + p.price_text;
          document.getElementById('toast').innerHTML = `<div class="toast">${esc(e.message)}</div>`;
          setTimeout(() => (document.getElementById('toast').innerHTML = ''), 2600);
        }
      };
    }

    load();
  })();
  </script>
</body>
</html>
